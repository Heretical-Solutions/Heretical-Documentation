name: pages

# Trusted pull requests build and validate only; fork/Dependabot PRs run the
# source-independent structure job without the private-source token. A push to
# master, or a manual dispatch of master's workflow carrying optional exact
# source SHAs, may deploy. Publication is GitHub Actions + Pages artifact to
# project Pages; there is no gh-pages branch and no Jekyll build on GitHub.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      superproject_sha:
        description: "Exact 40-hex superproject commit to aggregate (blank = manifest pin)"
        required: false
        type: string
      blog_sha:
        description: "Exact 40-hex blog commit to aggregate (blank = manifest pin)"
        required: false
        type: string

# Single non-cancelling group so a deployment is never interrupted mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  structure:
    name: Source-independent structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out portal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.18.0"
          cache: npm
      - name: Check structure without source credentials
        run: eng/check-structure.sh

  build:
    name: Restore, build, validate, package
    needs: structure
    # Fork and Dependabot PRs receive no private-source token. They run the
    # structure job only; a trusted branch must complete full validation.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.18.0"
          cache: npm

      - name: Restore pinned toolchain, theme, and sources
        env:
          PORTAL_SRC_SUPERPROJECT_SHA: ${{ inputs.superproject_sha }}
          PORTAL_SRC_BLOG_SHA: ${{ inputs.blog_sha }}
          # A fine-grained read-only token for the private superproject only.
          # Empty for untrusted PRs; never written into a Git remote or artifact.
          PORTAL_SOURCE_TOKEN: ${{ secrets.WORKSPACE_READ_TOKEN }}
        run: eng/restore.sh

      - name: Build and validate
        run: eng/validate.sh

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
