name: pages

# Woodpecker owns routine structural and full validation. This is the narrow,
# manual-only GitHub Actions fallback for GitHub Pages artifact publication,
# which requires GitHub's Pages/OIDC integration. It never runs on push or pull
# request. Dispatch from master only after reviewing every explicitly mapped
# private-source document for public disclosure.

on:
  workflow_dispatch:
    inputs:
      superproject_sha:
        description: "Exact 40-hex superproject commit to aggregate (blank = manifest pin)"
        required: false
        type: string
      blog_sha:
        description: "Exact 40-hex blog commit to aggregate (blank = manifest pin)"
        required: false
        type: string
      disclosure_reviewed:
        description: "I reviewed every selected private-source document for public disclosure"
        required: true
        default: false
        type: boolean

# Single non-cancelling group so a deployment is never interrupted mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Restore, revalidate, and package
    runs-on: ubuntu-latest
    steps:
      - name: Confirm disclosure review
        env:
          DISCLOSURE_REVIEWED: ${{ inputs.disclosure_reviewed }}
        run: |
          if [ "$DISCLOSURE_REVIEWED" != "true" ]; then
            echo "::error::Review every selected private-source document and set disclosure_reviewed=true before publication."
            exit 1
          fi

      - name: Check out portal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.18.0"
          cache: npm

      - name: Restore pinned toolchain, theme, and sources
        env:
          PORTAL_SRC_SUPERPROJECT_SHA: ${{ inputs.superproject_sha }}
          PORTAL_SRC_BLOG_SHA: ${{ inputs.blog_sha }}
          # A fine-grained read-only token for the private superproject only.
          # Never written into a Git remote or artifact.
          PORTAL_SOURCE_TOKEN: ${{ secrets.WORKSPACE_READ_TOKEN }}
        run: eng/restore.sh --clean

      - name: Build and validate
        run: eng/validate.sh

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
