# HTML presentation settings for the Heretical documentation portal.
# Theme files are staged from the pinned npm package into the ignored
# artifacts/doxygen/theme directory by eng/build.sh before generation, so these
# paths are stable and relative to the repository root (never machine-specific).

HTML_OUTPUT            = html
HTML_FILE_EXTENSION    = .html
HTML_HEADER            = doxygen/header.html
HTML_FOOTER            =
HTML_STYLESHEET        =
HTML_EXTRA_STYLESHEET  = artifacts/doxygen/theme/doxygen-awesome.css \
                         artifacts/doxygen/theme/doxygen-awesome-sidebar-only.css \
                         artifacts/doxygen/theme/doxygen-awesome-sidebar-only-darkmode-toggle.css \
                         assets/custom.css
HTML_EXTRA_FILES       = artifacts/doxygen/theme/doxygen-awesome-darkmode-toggle.js \
                         artifacts/doxygen/theme/doxygen-awesome-fragment-copy-button.js \
                         artifacts/doxygen/theme/doxygen-awesome-paragraph-link.js \
                         artifacts/doxygen/theme/doxygen-awesome-interactive-toc.js \
                         artifacts/doxygen/theme/doxygen-awesome-tabs.js \
                         assets/favicon.svg

HTML_COLORSTYLE        = LIGHT
HTML_COLORSTYLE_HUE    = 220
HTML_COLORSTYLE_SAT    = 100
HTML_COLORSTYLE_GAMMA  = 80
HTML_DYNAMIC_SECTIONS  = NO
HTML_CODE_FOLDING      = YES
HTML_COPY_CLIPBOARD    = NO
HTML_INDEX_NUM_ENTRIES = 100

GENERATE_TREEVIEW      = YES
FULL_SIDEBAR           = NO
PAGE_OUTLINE_PANEL     = YES
TREEVIEW_WIDTH         = 320
EXT_LINKS_IN_WINDOW    = NO
OBFUSCATE_EMAILS       = YES
